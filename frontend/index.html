<!DOCTYPE html>
<html lang="">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/ticket2.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Athens Cinemas</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <style>
      /* Static copy of LoadingView, shown before the JS loads. Vue replaces it on mount. */
      .splash { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 100%; text-align: center; }
      .splash h1 { background: linear-gradient(45deg, #BB86FC, #697dd6, #03DAC6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 1rem; }
      .splash div { color: #BB86FC; height: 150px; }
      body[data-bs-theme=light] .splash h1 { background-image: linear-gradient(45deg, #a534da, #3857e6, #00b097); }
      body[data-bs-theme=light] .splash div { color: #a534da; }
    </style>
  </head>
  <body>
    <script>
      try { document.body.setAttribute('data-bs-theme', localStorage.getItem('theme') || 'dark'); }
      catch { document.body.setAttribute('data-bs-theme', 'dark'); }
    </script>
    <div id="app">
      <div class="splash">
        <h1>Athens Cinemas</h1>
        <div>Φέρνουμε βόλτα όλα τα σινεμά της Αττικής.</div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js" integrity="sha384-0pUGZvbkm6XF6gxjEnlmuGrJXVbNuzT9qBBavbLwCsOGabYfZo0T0to5eqruptLy" crossorigin="anonymous"></script>  
  </body>
</html>
